# AX v1alpha1 Task manifest for Step 4 of the hero demo: Custom Image Task, without a starter template.
#
# Matches google/ax/hack/hero-demo/task-custom.yaml verbatim: runs the workspace's
# unit tests in a stock python:3.12-slim image (no bundled ax-task-runner and no git),
# relying on ate-local's automatic /usr/local/bin/ax-task-runner injection and the
# pre-warmed hero-demo-ws workspace snapshot.
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: hero-demo-custom-task
  atespace: default
spec:
  profile:
    image: python:3.12-slim
    resources:
      limits:
        cpu: "1"
        memory: "2Gi"
  workspace:
    name: hero-demo-ws
  commands:
    - python3
    - -m
    - unittest
    - discover
    - -s
    - /workspace/app
    - -p
    - "test_*.py"
