# AX v1alpha1 Workspace manifest for Step 2 of the hero demo: Warm Workspace Snapshot.
#
# spec.setup runs once and is captured in the workspace snapshot Tag, so tasks
# that bind this workspace start with /workspace/app already in place without
# re-running git init (even on images like python:3.12-slim that omit git).
apiVersion: ax.io/v1alpha1
kind: Workspace
metadata:
  name: hero-demo-ws
  atespace: default
spec:
  profile:
    image: "ghcr.io/ghchinoy/ax-images/genkit-runner@sha256:2620b7bc3dc328147b034c1210c29999589eef977e05bd027529e5d882fc4fcd"
    resources:
      limits:
        cpu: "2"
        memory: "4Gi"
  setup:
    commands:
      - git init /workspace/app 2>/dev/null || mkdir -p /workspace/app
      - printf "def add(a, b):\n    return a + b\n" > /workspace/app/math_utils.py
      - printf "import unittest\nfrom math_utils import add\n\nclass TestMath(unittest.TestCase):\n    def test_add(self):\n        self.assertEqual(add(2, 3), 5)\n" > /workspace/app/test_math.py
