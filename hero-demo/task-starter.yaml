# AX v1alpha1 Task manifest for Step 3 of the hero demo: Starter Task, Session & Resume.
#
# Runs the multi-arch, digest-pinned Genkit Go starter image (ghchinoy/ax-images v0.2.0)
# against the pre-warmed hero-demo-ws workspace, preserving multi-turn sessions in
# /workspace/.genkit/snapshots across `ax suspend` and `ax resume`.
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: hero-demo-starter-task
  atespace: default
spec:
  profile:
    image: "ghcr.io/ghchinoy/ax-images/genkit-runner@sha256:2620b7bc3dc328147b034c1210c29999589eef977e05bd027529e5d882fc4fcd"
    resources:
      limits:
        cpu: "2"
        memory: "4Gi"
  workspace:
    name: hero-demo-ws
  sessionId: "hero-demo-session"
  config:
    name: hero_coder
    description: Starter coding agent for the AX v0.1 hero demo.
    model: googleai/gemini-3.8-flash
    instruction: |
      You are a concise Python engineer working in /workspace/app.
      Always use read_file and write_file (under /workspace) when asked to update
      code or tests, and keep replies to 1-2 short sentences.
    maxTurns: 10
    use:
      - name: genkit-middleware/filesystem
        config:
          rootDirectory: /workspace
          allowWriteAccess: true
  env:
    - name: GEMINI_API_KEY
      value: "${GEMINI_API_KEY}"
  debug: true
