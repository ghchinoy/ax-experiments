metadata:
  name: billing-ws
  atespace: default
spec:
  files:
    - path: "ledger/invoices.json"
      content: |
        {
          "invoices": [
            {
              "invoice_id": "INV-9481",
              "account": "acct-42",
              "customer": "Acme Robotics",
              "charges": [
                {"tx_id": "ch_101", "amount_usd": 500.00, "timestamp": "2026-11-07T08:01:12Z", "status": "settled"},
                {"tx_id": "ch_102", "amount_usd": 500.00, "timestamp": "2026-11-07T08:01:14Z", "status": "settled_duplicate"}
